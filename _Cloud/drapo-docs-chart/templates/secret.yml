# Secret material is NEVER stored in this repo (it is public).
# The base64 values below are injected at deploy time via `helm --set-file`
# from GitHub Actions secrets (see .github/workflows/docker-image.yml).
# The `if` guards let `helm template`/`helm lint` run without the secrets present.
{{- if and .Values.tls .Values.tls.crt .Values.tls.key }}
apiVersion: v1
kind: Secret
metadata:
  name: tech6cloud-cert
  namespace: {{ .Release.Namespace }}
type: kubernetes.io/tls
data:
  tls.crt: {{ .Values.tls.crt | quote }}
  tls.key: {{ .Values.tls.key | quote }}
---
{{- end }}
{{- if and .Values.acr .Values.acr.dockerconfigjson }}
apiVersion: v1
kind: Secret
metadata:
  name: aks-acr-contributor
  namespace: {{ .Release.Namespace }}
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: {{ .Values.acr.dockerconfigjson | quote }}
---
{{- end }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: aks-acr-contributor
  namespace: {{ .Release.Namespace }}
imagePullSecrets:
- name: aks-acr-contributor
